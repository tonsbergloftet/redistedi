<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rediger HTML</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:     #013952;
  --navy-dim: rgba(1,57,82,0.06);
  --border:   rgba(1,57,82,0.13);
  --bg:       #f7f8f9;
  --white:    #ffffff;
  --ink:      #1a1a1a;
  --ink-mid:  #444;
  --ink-dim:  #888;
  --green:    #00714e;
  --green-bg: #e0f2ec;
  --amber:    #f1be48;
  --amber-bg: #fdf5dc;
  --sans:     "Barlow", system-ui, sans-serif;
  --topbar:   48px;
}

html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--ink); overflow: hidden; }

/* ── LANDING ── */
#landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

.landing-inner {
  width: 100%;
  max-width: 480px;
}

.landing-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 6px;
}

.landing-sub {
  font-size: 14px;
  font-weight: 300;
  color: var(--ink-dim);
  line-height: 1.65;
  margin-bottom: 32px;
  max-width: 380px;
}

.upload-btn {
  width: 100%;
  padding: 13px;
  background: var(--white);
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  color: var(--navy);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  margin-bottom: 10px;
}
.upload-btn:hover { border-color: var(--navy); background: var(--navy-dim); }

.divider {
  text-align: center;
  font-size: 12px;
  color: var(--ink-dim);
  margin: 14px 0;
  font-weight: 300;
}

textarea#pasteArea {
  width: 100%;
  min-height: 160px;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 300;
  color: var(--ink);
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
  margin-bottom: 10px;
  line-height: 1.55;
}
textarea#pasteArea:focus { border-color: var(--navy); }
textarea#pasteArea::placeholder { color: var(--ink-dim); }

.open-btn {
  width: 100%;
  padding: 13px;
  background: var(--navy);
  border: none;
  border-radius: 12px;
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 600;
  color: var(--white);
  cursor: pointer;
  transition: opacity 0.15s;
  margin-top: 4px;
}
.open-btn:disabled { opacity: 0.3; cursor: default; }
.open-btn:not(:disabled):hover { opacity: 0.88; }

/* ── EDITOR ── */
#editor { display: none; flex-direction: column; height: 100vh; }

/* Topbar */
.topbar {
  height: var(--topbar);
  background: var(--navy);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 50;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-back {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  padding: 5px 12px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  color: white;
  cursor: pointer;
  transition: background 0.15s;
}
.topbar-back:hover { background: rgba(255,255,255,0.2); }
.topbar-title {
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.02em;
}
.topbar-right { display: flex; align-items: center; gap: 8px; }
.topbar-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  padding: 5px 14px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  color: white;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.topbar-btn:hover { background: rgba(255,255,255,0.2); }
.topbar-btn.primary {
  background: rgba(255,255,255,0.15);
  border-color: rgba(255,255,255,0.35);
}

/* Panels */
.panels {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Resizer */
.resizer {
  width: 5px;
  background: var(--border);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background 0.15s;
  position: relative;
  z-index: 10;
}
.resizer:hover, .resizer.dragging { background: var(--navy); }

/* Left panel */
.panel-left {
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  width: 340px;
  min-width: 200px;
  max-width: 70vw;
  flex-shrink: 0;
}

/* Preview-modus */
.panels.preview-mode .panel-left,
.panels.preview-mode .resizer { display: none; }
.panels.preview-mode .panel-right { flex: 1; }
.topbar-btn.active {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.5);
}

.panel-search {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-search input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
}
.panel-search input:focus { border-color: var(--navy); }
.panel-search input::placeholder { color: var(--ink-dim); }

.panel-fields {
  flex: 1;
  overflow-y: auto;
  padding: 10px 0 20px;
}
.panel-fields::-webkit-scrollbar { width: 4px; }
.panel-fields::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Field group */
.field-group { margin-bottom: 2px; }

.group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  cursor: pointer;
  user-select: none;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  font-family: var(--sans);
}
.group-header:hover { background: var(--navy-dim); }

.group-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
  flex: 1;
}
.group-count {
  font-size: 10px;
  color: var(--ink-dim);
  background: var(--bg);
  padding: 2px 7px;
  border-radius: 20px;
  border: 1px solid var(--border);
}
.group-chevron {
  font-size: 10px;
  color: var(--ink-dim);
  transition: transform 0.2s;
}
.group-header.open .group-chevron { transform: rotate(90deg); }

.group-fields { display: none; }
.group-fields.open { display: block; }

/* Field row */
.field-row {
  padding: 6px 14px 6px 22px;
  border-bottom: 1px solid rgba(1,57,82,0.05);
  transition: background 0.1s;
}
.field-row:hover { background: var(--navy-dim); }
.field-row.active { background: #eef5f9; }

.field-tag {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 3px;
}
.field-tag.h1 { color: var(--navy); }
.field-tag.h2 { color: #1a5c7a; }
.field-tag.h3 { color: #2a7a9a; }
.field-tag.p  { color: var(--ink-dim); }
.field-tag.li { color: #5a7a6a; }
.field-tag.a  { color: #3a6aaa; }
.field-tag.td { color: #7a5a3a; }
.field-tag.btn { color: #7a3a6a; }

.field-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid transparent;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 300;
  color: var(--ink);
  outline: none;
  padding: 2px 0;
  transition: border-color 0.15s;
  resize: none;
  overflow: hidden;
  line-height: 1.5;
}
.field-input:focus {
  border-bottom-color: var(--navy);
}
.field-input.changed { color: var(--navy); font-weight: 400; }

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--ink-dim);
  font-size: 13px;
  font-weight: 300;
  line-height: 1.65;
}

/* Stats bar */
.panel-stats {
  border-top: 1px solid var(--border);
  padding: 8px 14px;
  font-size: 11px;
  color: var(--ink-dim);
  font-weight: 300;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stats-changed {
  font-weight: 600;
  color: var(--navy);
}

/* Right panel — preview */
.panel-right {
  position: relative;
  overflow: hidden;
  background: #e8edf0;
  flex: 1;
}

.preview-label {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(1,57,82,0.35);
  z-index: 10;
  pointer-events: none;
  white-space: nowrap;
}

#preview {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  background: white;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(1,57,82,0.5);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--white);
  border-radius: 16px;
  padding: 28px 32px;
  max-width: 400px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(1,57,82,0.2);
  animation: modalIn 0.15s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
.modal-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.modal-body  { font-size: 13px; font-weight: 300; color: var(--ink-mid); line-height: 1.65; margin-bottom: 24px; }
.modal-btns  { display: flex; gap: 10px; justify-content: flex-end; }
.modal-cancel {
  background: none; border: 1.5px solid var(--border); border-radius: 8px;
  padding: 8px 18px; font-family: var(--sans); font-size: 13px; font-weight: 600;
  color: var(--ink-mid); cursor: pointer; transition: border-color 0.15s;
}
.modal-cancel:hover { border-color: var(--navy); color: var(--navy); }
.modal-confirm {
  background: var(--navy); border: none; border-radius: 8px;
  padding: 8px 18px; font-family: var(--sans); font-size: 13px; font-weight: 600;
  color: white; cursor: pointer; transition: opacity 0.15s;
}
.modal-confirm:hover { opacity: 0.85; }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--navy);
  color: white;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 30px;
  box-shadow: 0 8px 24px rgba(1,57,82,0.3);
  z-index: 300;
  transition: transform 0.25s ease;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── KOMMENTARER ── */
.field-row-header {
  display: flex;
  align-items: flex-start;
  gap: 6px;
}
.field-row-header .field-tag { flex: 1; }

.comment-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 12px;
  padding: 1px 4px;
  border-radius: 4px;
  color: var(--ink-dim);
  transition: background 0.1s, color 0.1s;
  flex-shrink: 0;
  line-height: 1;
}
.comment-btn:hover { background: var(--navy-dim); color: var(--navy); }
.comment-btn.has-comments { color: var(--amber); font-weight: 700; }

.comments-panel {
  margin: 6px 0 4px;
  display: none;
}
.comments-panel.open { display: block; }

.comment-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  margin-bottom: 6px;
  font-size: 12px;
}
.comment-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.comment-author {
  font-weight: 700;
  color: var(--navy);
  font-size: 11px;
}
.comment-date {
  font-size: 10px;
  color: var(--ink-dim);
}
.comment-text {
  color: var(--ink-mid);
  line-height: 1.55;
  margin-bottom: 6px;
  font-weight: 300;
}
.comment-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.comment-action-btn {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--ink-dim);
  cursor: pointer;
  font-family: var(--sans);
  transition: all 0.12s;
}
.comment-action-btn:hover { border-color: var(--navy); color: var(--navy); }
.comment-action-btn.delete { color: #923c3d; }
.comment-action-btn.delete:hover { border-color: #923c3d; background: #f3e4e4; }

/* Svar-innrykk */
.comment-replies { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--border); }
.reply-item {
  padding: 5px 0;
  border-bottom: 1px solid rgba(1,57,82,0.05);
}
.reply-item:last-child { border-bottom: none; }
.reply-meta { display: flex; justify-content: space-between; margin-bottom: 2px; }
.reply-author { font-size: 10px; font-weight: 700; color: var(--navy); }
.reply-date { font-size: 10px; color: var(--ink-dim); }
.reply-text { font-size: 11px; color: var(--ink-mid); line-height: 1.5; font-weight: 300; }
.reply-delete {
  font-size: 9px; color: var(--ink-dim); background: none;
  border: none; cursor: pointer; padding: 0; margin-top: 2px;
  font-family: var(--sans);
}
.reply-delete:hover { color: #923c3d; }

/* Ny kommentar / svar-skjema */
.comment-form {
  margin-top: 6px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
}
.comment-form input,
.comment-form textarea {
  width: 100%;
  font-family: var(--sans);
  font-size: 12px;
  border: none;
  border-bottom: 1px solid var(--border);
  padding: 4px 0;
  margin-bottom: 6px;
  outline: none;
  background: transparent;
  color: var(--ink);
  font-weight: 300;
}
.comment-form input::placeholder,
.comment-form textarea::placeholder { color: var(--ink-dim); }
.comment-form input:focus,
.comment-form textarea:focus { border-bottom-color: var(--navy); }
.comment-form textarea { resize: none; min-height: 48px; line-height: 1.5; }
.comment-form-btns { display: flex; gap: 6px; justify-content: flex-end; }
.cf-cancel {
  font-size: 11px; font-weight: 600; padding: 4px 10px;
  border-radius: 20px; border: 1px solid var(--border);
  background: none; color: var(--ink-dim);
  cursor: pointer; font-family: var(--sans);
}
.cf-submit {
  font-size: 11px; font-weight: 600; padding: 4px 10px;
  border-radius: 20px; border: none;
  background: var(--navy); color: white;
  cursor: pointer; font-family: var(--sans);
  transition: opacity 0.12s;
}
.cf-submit:hover { opacity: 0.85; }
.cf-submit:disabled { opacity: 0.3; cursor: default; }
  .panel-right { display: none; }
  .topbar-title { display: none; }
}
</style>
</head>
<body>

<!-- ── LANDING ── -->
<div id="landing">
  <div class="landing-inner">
    <div class="landing-title">Rediger HTML</div>
    <p class="landing-sub">Last opp en HTML-fil eller lim inn kode. Rediger tekst direkte i panelet — ingen kode nødvendig.</p>

    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
      ↑ Last opp .html-fil
    </button>
    <input type="file" id="fileInput" accept=".html,.htm" style="display:none" onchange="handleFile(this)">

    <div class="divider">— eller —</div>

    <textarea id="pasteArea" placeholder="Lim inn HTML-kode her..."></textarea>
    <button class="open-btn" id="openBtn" onclick="openFromPaste()" disabled>
      Åpne i editor →
    </button>
  </div>
</div>

<!-- ── EDITOR ── -->
<div id="editor">
  <div class="topbar">
    <div class="topbar-left">
      <button class="topbar-back" onclick="goBack()">← Tilbake</button>
      <span class="topbar-title">Rediger HTML</span>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn" id="previewToggleBtn" onclick="togglePreview()">⛶ Forhåndsvisning</button>
      <button class="topbar-btn" onclick="debugPreview()" style="opacity:0.5;font-size:10px">debug</button>
      <button class="topbar-btn" onclick="downloadHtml()">↓ Last ned</button>
    </div>
  </div>

  <div class="panels" id="panels">
    <!-- Venstre panel -->
    <div class="panel-left" id="panelLeft">
      <div class="panel-search">
        <input type="text" id="searchInput" placeholder="Søk i tekst..." oninput="filterFields(this.value)">
      </div>
      <div class="panel-fields" id="fieldList"></div>
      <div class="panel-stats">
        <span id="statsTotal"></span>
        <span class="stats-changed" id="statsChanged"></span>
      </div>
    </div>

    <!-- Resizer -->
    <div class="resizer" id="resizer"></div>

    <!-- Høyre panel -->
    <div class="panel-right">
      <div class="preview-label" id="previewLabel">Forhåndsvisning</div>
      <iframe id="preview" title="Forhåndsvisning"></iframe>
    </div>
  </div>
</div>

<!-- Advarsel-modal -->
<div class="modal-overlay" id="backModal">
  <div class="modal">
    <div class="modal-title">Ulagrede endringer</div>
    <p class="modal-body">Du har gjort endringer som ikke er lastet ned. Hvis du går tilbake nå mister du disse.</p>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Avbryt</button>
      <button class="modal-confirm" onclick="confirmBack()">Gå tilbake uten å lagre</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let currentHtml = '';
let originalHtml = '';
let fields = [];       // { id, groupId, el, tag, originalText }
let groups = [];       // { id, label, fields: [] }
let changedIds = new Set();
let domDoc = null;

// ── LANDING ──
document.getElementById('pasteArea').addEventListener('input', function() {
  document.getElementById('openBtn').disabled = !this.value.trim();
});

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => loadHtml(e.target.result, file.name);
  reader.readAsText(file);
}

function openFromPaste() {
  const html = document.getElementById('pasteArea').value.trim();
  if (html) loadHtml(html, 'dokument.html');
}

// ── LOAD HTML ──
function loadHtml(html, filename) {
  originalHtml = html;
  currentHtml = html;
  changedIds.clear();

  // Parse
  const parser = new DOMParser();
  domDoc = parser.parseFromString(html, 'text/html');

  // Bygg felter
  buildFields();

  // Vis editor
  document.getElementById('landing').style.display = 'none';
  const editorEl = document.getElementById('editor');
  editorEl.style.display = 'flex';

  // Oppdater topbar-tittel
  const titleTag = domDoc.querySelector('title');
  if (titleTag && titleTag.textContent.trim()) {
    document.querySelector('.topbar-title').textContent = titleTag.textContent.trim();
  } else {
    document.querySelector('.topbar-title').textContent = filename;
  }

  // Sett preview etter at editor er i DOM
  requestAnimationFrame(() => updatePreview());

  // beforeunload
  window.addEventListener('beforeunload', beforeUnloadHandler);
}

// ── PARSER ──
const TAGS = ['h1','h2','h3','h4','h5','h6','p','li','a','td','th','button','span','label','figcaption','caption','dt','dd','blockquote'];
const SKIP = ['script','style','noscript','code','pre','select','option','textarea'];

function getGroupLabel(el) {
  // Finn nærmeste meningsfulle forelder
  const section = el.closest('section, article, header, footer, nav, main, aside, [class*="slide"], [class*="section"], [class*="card"], [class*="block"], [class*="panel"]');
  if (section) {
    // Prøv å hente et fornuftig navn
    const heading = section.querySelector('h1,h2,h3,h4');
    if (heading && heading.textContent.trim()) {
      return truncate(heading.textContent.trim(), 32);
    }
    // Prøv id eller klasse
    if (section.id) return '#' + section.id;
    const cls = section.className?.toString().split(' ').find(c => c.length > 2 && c.length < 24);
    if (cls) return '.' + cls;
  }
  // Fallback: body-seksjoner
  const bodyChildren = Array.from(domDoc.body.children);
  const topParent = bodyChildren.find(c => c.contains(el));
  if (topParent) {
    if (topParent.id) return '#' + topParent.id;
    const cls = topParent.className?.toString().split(' ').find(c => c.length > 2 && c.length < 24);
    if (cls) return '.' + cls;
    return topParent.tagName.toLowerCase() + ' ' + (bodyChildren.indexOf(topParent) + 1);
  }
  return 'Innhold';
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n) + '…' : str;
}

function isVisible(el) {
  const style = domDoc.defaultView?.getComputedStyle?.(el);
  if (style && style.display === 'none') return false;
  return true;
}

function buildFields() {
  fields = [];
  groups = [];
  const groupMap = {};
  let fieldId = 0;

  const allEls = domDoc.body.querySelectorAll(TAGS.join(','));

  allEls.forEach(el => {
    // Skip-elementer
    if (SKIP.some(t => el.closest(t))) return;
    // Skip elementer uten direkte tekstinnhold
    const directText = Array.from(el.childNodes)
      .filter(n => n.nodeType === 3)
      .map(n => n.textContent)
      .join('')
      .trim();
    if (!directText) return;
    // Skip for korte/meningsløse tekster
    if (directText.length < 1) return;

    const tag = el.tagName.toLowerCase();
    const groupLabel = getGroupLabel(el);
    const groupKey = groupLabel;

    if (!groupMap[groupKey]) {
      const gid = 'g' + groups.length;
      groupMap[groupKey] = gid;
      groups.push({ id: gid, label: groupLabel, fieldIds: [] });
    }

    const fid = 'f' + fieldId++;
    const gid = groupMap[groupKey];
    groups.find(g => g.id === gid).fieldIds.push(fid);

    fields.push({
      id: fid,
      groupId: gid,
      el,
      tag,
      originalText: directText,
    });
  });

  renderFields();
  updateStats();
}

function renderFields(filter = '') {
  const list = document.getElementById('fieldList');
  list.innerHTML = '';

  if (fields.length === 0) {
    list.innerHTML = '<div class="empty-state">Ingen redigerbare tekstfelt funnet i denne filen.</div>';
    return;
  }

  const lf = filter.toLowerCase();

  groups.forEach(group => {
    const groupFields = group.fieldIds.map(fid => fields.find(f => f.id === fid)).filter(Boolean);
    const visibleFields = lf
      ? groupFields.filter(f => f.originalText.toLowerCase().includes(lf) || f.el.textContent.toLowerCase().includes(lf))
      : groupFields;

    if (visibleFields.length === 0) return;

    const groupDiv = document.createElement('div');
    groupDiv.className = 'field-group';
    groupDiv.id = 'grp-' + group.id;

    const header = document.createElement('button');
    header.className = 'group-header open';
    header.innerHTML = `
      <span class="group-label">${escHtml(group.label)}</span>
      <span class="group-count">${visibleFields.length}</span>
      <span class="group-chevron">›</span>
    `;
    header.addEventListener('click', () => {
      header.classList.toggle('open');
      fieldsDiv.classList.toggle('open');
    });

    const fieldsDiv = document.createElement('div');
    fieldsDiv.className = 'group-fields open';

    visibleFields.forEach(field => {
      const row = buildFieldRow(field);
      fieldsDiv.appendChild(row);
    });

    groupDiv.appendChild(header);
    groupDiv.appendChild(fieldsDiv);
    list.appendChild(groupDiv);
  });

  if (list.children.length === 0) {
    list.innerHTML = '<div class="empty-state">Ingen felt matcher søket.</div>';
  }

  // Resize alle textareas etter at de er i DOM
  requestAnimationFrame(() => {
    list.querySelectorAll('textarea.field-input').forEach(autoResize);
  });
}

function buildFieldRow(field) {
  const row = document.createElement('div');
  row.className = 'field-row';
  row.id = 'row-' + field.id;
  if (changedIds.has(field.id)) row.classList.add('active');

  // Header-rad: tag + kommentarknapp
  const headerDiv = document.createElement('div');
  headerDiv.className = 'field-row-header';

  const tag = document.createElement('div');
  tag.className = 'field-tag ' + field.tag;
  tag.textContent = field.tag.toUpperCase();

  const commentCount = getCommentsForField(field.id).length;
  const commentBtn = document.createElement('button');
  commentBtn.className = 'comment-btn' + (commentCount > 0 ? ' has-comments' : '');
  commentBtn.id = 'commentBtn-' + field.id;
  commentBtn.textContent = commentCount > 0 ? `💬 ${commentCount}` : '💬';
  commentBtn.title = 'Kommentarer';
  commentBtn.addEventListener('click', e => {
    e.stopPropagation();
    toggleComments(field.id);
  });

  headerDiv.appendChild(tag);
  headerDiv.appendChild(commentBtn);

  // Input
  const isLong = field.originalText.length > 60;
  const input = document.createElement(isLong ? 'textarea' : 'input');
  input.className = 'field-input' + (changedIds.has(field.id) ? ' changed' : '');
  input.value = getCurrentText(field);
  if (input.tagName === 'TEXTAREA') {
    input.rows = 2;
  }

  input.addEventListener('input', () => {
    updateField(field, input.value);
    if (input.tagName === 'TEXTAREA') autoResize(input);
  });

  input.addEventListener('focus', () => row.classList.add('active'));
  input.addEventListener('blur', () => { if (!changedIds.has(field.id)) row.classList.remove('active'); });

  // Kommentar-panel
  const commentsPanel = document.createElement('div');
  commentsPanel.className = 'comments-panel';
  commentsPanel.id = 'comments-' + field.id;

  row.appendChild(headerDiv);
  row.appendChild(input);
  row.appendChild(commentsPanel);
  return row;
}

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

function getCurrentText(field) {
  // Les direkte tekstnoder fra domDoc
  return Array.from(field.el.childNodes)
    .filter(n => n.nodeType === 3)
    .map(n => n.textContent)
    .join('');
}

// ── OPPDATER FELT ──
function updateField(field, newText) {
  // Oppdater direkte tekstnoder i domDoc
  let firstText = true;
  field.el.childNodes.forEach(n => {
    if (n.nodeType === 3) {
      if (firstText) {
        n.textContent = newText;
        firstText = false;
      } else {
        n.textContent = '';
      }
    }
  });

  const changed = newText !== field.originalText;
  if (changed) {
    changedIds.add(field.id);
    document.getElementById('row-' + field.id)?.classList.add('active');
    const inp = document.querySelector('#row-' + field.id + ' .field-input');
    if (inp) inp.classList.add('changed');
  } else {
    changedIds.delete(field.id);
    document.getElementById('row-' + field.id)?.classList.remove('active');
    const inp = document.querySelector('#row-' + field.id + ' .field-input');
    if (inp) inp.classList.remove('changed');
  }

  updateStats();
  schedulePreview();
}

// ── PREVIEW (debounced) ──
let previewTimer = null;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 300);
}

function debugPreview() {
  const iframe = document.getElementById('preview');
  const info = {
    src: iframe.src,
    srcdoc: iframe.srcdoc?.slice(0,50),
    contentDocReady: !!iframe.contentDocument,
    bodyContent: iframe.contentDocument?.body?.innerHTML?.slice(0,100) || 'ingen tilgang',
    currentHtmlLength: currentHtml?.length,
    domDocReady: !!domDoc,
  };
  console.log('Preview debug:', info);
  alert(JSON.stringify(info, null, 2));
}

function updatePreview() {
  if (!domDoc) return;
  const serialized = '<!DOCTYPE html>\n' + domDoc.documentElement.outerHTML;
  currentHtml = serialized;
  const iframe = document.getElementById('preview');

  // Prøv document.write først
  try {
    const doc = iframe.contentDocument || iframe.contentWindow?.document;
    if (doc) {
      doc.open('text/html', 'replace');
      doc.write(serialized);
      doc.close();
      return;
    }
  } catch(e) {
    console.warn('document.write feilet:', e);
  }

  // Fallback: data URI
  try {
    const encoded = 'data:text/html;charset=utf-8,' + encodeURIComponent(serialized);
    iframe.src = encoded;
    return;
  } catch(e) {
    console.warn('data URI feilet:', e);
  }

  // Siste fallback: srcdoc
  iframe.srcdoc = serialized;
}

// ── SØK ──
function filterFields(val) {
  renderFields(val);
}

// ── STATS ──
function updateStats() {
  const total = fields.length;
  const changed = changedIds.size;
  const commentCount = domDoc ? getAllCommentCount() : 0;
  document.getElementById('statsTotal').textContent = `${total} felt`;
  const parts = [];
  if (changed > 0) parts.push(`${changed} endret`);
  if (commentCount > 0) parts.push(`${commentCount} 💬`);
  const changedEl = document.getElementById('statsChanged');
  changedEl.textContent = parts.join(' · ');
}

// ── LAST NED ──
function downloadHtml() {
  currentHtml = '<!DOCTYPE html>\n' + domDoc.documentElement.outerHTML;
  const blob = new Blob([currentHtml], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const title = domDoc.querySelector('title')?.textContent?.trim() || 'dokument';
  a.download = title.toLowerCase().replace(/\s+/g, '-') + '-redigert.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Fil lastet ned');
  // Merk alle som lagret
  changedIds.clear();
  updateStats();
  // Oppdater input-styling
  document.querySelectorAll('.field-input.changed').forEach(el => el.classList.remove('changed'));
  document.querySelectorAll('.field-row.active').forEach(el => el.classList.remove('active'));
}

// ── TILBAKE ──
function goBack() {
  if (changedIds.size > 0) {
    document.getElementById('backModal').classList.add('open');
  } else {
    doGoBack();
  }
}

function closeModal() {
  document.getElementById('backModal').classList.remove('open');
}

function confirmBack() {
  closeModal();
  doGoBack();
}

function doGoBack() {
  window.removeEventListener('beforeunload', beforeUnloadHandler);
  document.getElementById('editor').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
  // Reset landing
  document.getElementById('pasteArea').value = '';
  document.getElementById('openBtn').disabled = true;
  document.getElementById('fileInput').value = '';
  // Reset state
  fields = [];
  groups = [];
  changedIds.clear();
  domDoc = null;
  document.getElementById('fieldList').innerHTML = '';
}

function beforeUnloadHandler(e) {
  if (changedIds.size > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── PREVIEW TOGGLE ──
let previewMode = false;

function togglePreview() {
  previewMode = !previewMode;
  const panels = document.getElementById('panels');
  const btn = document.getElementById('previewToggleBtn');
  const label = document.getElementById('previewLabel');
  panels.classList.toggle('preview-mode', previewMode);
  btn.classList.toggle('active', previewMode);
  btn.textContent = previewMode ? '✕ Lukk fullskjerm' : '⛶ Forhåndsvisning';
  if (label) label.style.display = previewMode ? 'none' : '';
}

// ── UTILS ──

// ── RESIZER ──
(function() {
  const resizer = document.getElementById('resizer');
  const panelLeft = document.getElementById('panelLeft');
  let startX, startWidth, dragging = false;

  resizer.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startWidth = panelLeft.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    document.getElementById('preview').style.pointerEvents = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta = e.clientX - startX;
    const newWidth = Math.min(Math.max(startWidth + delta, 200), window.innerWidth * 0.7);
    panelLeft.style.width = newWidth + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    document.getElementById('preview').style.pointerEvents = '';
  });
})();

// ── KOMMENTARER ──
// Format: <!-- COMMENT:{"id":"c1","fieldId":"f3","author":"Kari","text":"...","date":"2026-08-20","replies":[]} -->
// Lagres rett før det tilhørende elementet i domDoc

const COMMENT_RE = /<!--\s*COMMENT:(\{.*?\})\s*-->/gs;

function parseComments() {
  const comments = {};
  const html = domDoc.documentElement.outerHTML;
  let m;
  COMMENT_RE.lastIndex = 0;
  while ((m = COMMENT_RE.exec(html)) !== null) {
    try {
      const c = JSON.parse(m[1]);
      if (!comments[c.fieldId]) comments[c.fieldId] = [];
      comments[c.fieldId].push(c);
    } catch(e) {}
  }
  return comments;
}

function saveComment(fieldId, author, text) {
  const field = fields.find(f => f.id === fieldId);
  if (!field) return;
  const id = 'c' + Date.now();
  const date = new Date().toLocaleDateString('no-NO', { day: 'numeric', month: 'short' });
  const comment = { id, fieldId, author, text, date, replies: [] };
  const commentStr = `<!-- COMMENT:${JSON.stringify(comment)} -->`;
  // Sett inn kommentarnode rett før elementet i domDoc
  const commentNode = domDoc.createComment(` COMMENT:${JSON.stringify(comment)} `);
  field.el.parentNode.insertBefore(commentNode, field.el);
  schedulePreview();
  return id;
}

function saveReply(fieldId, commentId, author, text) {
  const date = new Date().toLocaleDateString('no-NO', { day: 'numeric', month: 'short' });
  // Finn kommentar-noden i domDoc og oppdater JSON
  updateCommentNode(commentId, c => {
    c.replies.push({ id: 'r' + Date.now(), author, text, date });
    return c;
  });
  schedulePreview();
}

function deleteComment(commentId) {
  // Finn og fjern kommentar-noden fra domDoc
  findAndRemoveCommentNode(commentId);
  schedulePreview();
}

function deleteReply(commentId, replyId) {
  updateCommentNode(commentId, c => {
    c.replies = c.replies.filter(r => r.id !== replyId);
    return c;
  });
  schedulePreview();
}

function updateCommentNode(commentId, fn) {
  const walker = domDoc.createTreeWalker(domDoc.documentElement, NodeFilter.SHOW_COMMENT);
  let node;
  while ((node = walker.nextNode())) {
    const raw = node.nodeValue;
    if (raw.trim().startsWith('COMMENT:')) {
      try {
        const c = JSON.parse(raw.trim().slice(8));
        if (c.id === commentId) {
          const updated = fn(c);
          node.nodeValue = ` COMMENT:${JSON.stringify(updated)} `;
          return;
        }
      } catch(e) {}
    }
  }
}

function findAndRemoveCommentNode(commentId) {
  const walker = domDoc.createTreeWalker(domDoc.documentElement, NodeFilter.SHOW_COMMENT);
  let node;
  while ((node = walker.nextNode())) {
    const raw = node.nodeValue;
    if (raw.trim().startsWith('COMMENT:')) {
      try {
        const c = JSON.parse(raw.trim().slice(8));
        if (c.id === commentId) {
          node.parentNode.removeChild(node);
          return;
        }
      } catch(e) {}
    }
  }
}

function getCommentsForField(fieldId) {
  const result = [];
  const walker = domDoc.createTreeWalker(domDoc.documentElement, NodeFilter.SHOW_COMMENT);
  let node;
  while ((node = walker.nextNode())) {
    const raw = node.nodeValue;
    if (raw.trim().startsWith('COMMENT:')) {
      try {
        const c = JSON.parse(raw.trim().slice(8));
        if (c.fieldId === fieldId) result.push(c);
      } catch(e) {}
    }
  }
  return result;
}

function getAllCommentCount() {
  let count = 0;
  const walker = domDoc.createTreeWalker(domDoc.documentElement, NodeFilter.SHOW_COMMENT);
  let node;
  while ((node = walker.nextNode())) {
    if (node.nodeValue.trim().startsWith('COMMENT:')) count++;
  }
  return count;
}

// ── RENDER KOMMENTARER PÅ ET FELT ──
function renderComments(fieldId, container) {
  container.innerHTML = '';
  const comments = getCommentsForField(fieldId);
  if (comments.length === 0) return;

  comments.forEach(c => {
    const item = document.createElement('div');
    item.className = 'comment-item';

    // Svar-HTML
    const repliesHtml = c.replies.length > 0 ? `
      <div class="comment-replies">
        ${c.replies.map(r => `
          <div class="reply-item">
            <div class="reply-meta">
              <span class="reply-author">${escHtml(r.author)}</span>
              <span class="reply-date">${escHtml(r.date)}</span>
            </div>
            <div class="reply-text">${escHtml(r.text)}</div>
            <button class="reply-delete" onclick="handleDeleteReply('${fieldId}','${c.id}','${r.id}')">Slett svar</button>
          </div>
        `).join('')}
      </div>` : '';

    item.innerHTML = `
      <div class="comment-meta">
        <span class="comment-author">${escHtml(c.author)}</span>
        <span class="comment-date">${escHtml(c.date)}</span>
      </div>
      <div class="comment-text">${escHtml(c.text)}</div>
      ${repliesHtml}
      <div class="comment-actions">
        <button class="comment-action-btn" onclick="showReplyForm('${fieldId}','${c.id}',this)">↩ Svar</button>
        <button class="comment-action-btn delete" onclick="handleDeleteComment('${fieldId}','${c.id}')">Slett</button>
      </div>
      <div class="reply-form-placeholder"></div>
    `;
    container.appendChild(item);
  });
}

function showReplyForm(fieldId, commentId, btn) {
  // Fjern eksisterende reply-skjema
  document.querySelectorAll('.inline-reply-form').forEach(f => f.remove());
  const placeholder = btn.closest('.comment-item').querySelector('.reply-form-placeholder');
  const form = document.createElement('div');
  form.className = 'comment-form inline-reply-form';
  form.style.marginTop = '8px';
  form.innerHTML = `
    <input type="text" placeholder="Ditt navn" id="replyAuthor-${commentId}" maxlength="40">
    <textarea placeholder="Skriv svar..." id="replyText-${commentId}" rows="2"></textarea>
    <div class="comment-form-btns">
      <button class="cf-cancel" onclick="this.closest('.inline-reply-form').remove()">Avbryt</button>
      <button class="cf-submit" onclick="handleSaveReply('${fieldId}','${commentId}')">Svar</button>
    </div>
  `;
  placeholder.appendChild(form);
}

function showCommentForm(fieldId, container) {
  // Fjern eksisterende
  container.querySelectorAll('.comment-form').forEach(f => f.remove());
  const form = document.createElement('div');
  form.className = 'comment-form';
  form.innerHTML = `
    <input type="text" placeholder="Ditt navn" id="newCommentAuthor-${fieldId}" maxlength="40">
    <textarea placeholder="Skriv kommentar..." id="newCommentText-${fieldId}" rows="2"></textarea>
    <div class="comment-form-btns">
      <button class="cf-cancel" onclick="this.closest('.comment-form').remove()">Avbryt</button>
      <button class="cf-submit" onclick="handleSaveComment('${fieldId}')">Lagre</button>
    </div>
  `;
  container.appendChild(form);
  document.getElementById(`newCommentAuthor-${fieldId}`)?.focus();
}

function handleSaveComment(fieldId) {
  const author = document.getElementById(`newCommentAuthor-${fieldId}`)?.value.trim();
  const text = document.getElementById(`newCommentText-${fieldId}`)?.value.trim();
  if (!author || !text) return;
  saveComment(fieldId, author, text);
  refreshFieldComments(fieldId);
  updateStats();
}

function handleSaveReply(fieldId, commentId) {
  const author = document.getElementById(`replyAuthor-${commentId}`)?.value.trim();
  const text = document.getElementById(`replyText-${commentId}`)?.value.trim();
  if (!author || !text) return;
  saveReply(fieldId, commentId, author, text);
  refreshFieldComments(fieldId);
}

function handleDeleteComment(fieldId, commentId) {
  deleteComment(commentId);
  refreshFieldComments(fieldId);
  updateStats();
}

function handleDeleteReply(fieldId, commentId, replyId) {
  deleteReply(commentId, replyId);
  refreshFieldComments(fieldId);
}

function refreshFieldComments(fieldId) {
  const panel = document.getElementById(`comments-${fieldId}`);
  const btn = document.getElementById(`commentBtn-${fieldId}`);
  if (panel) {
    renderComments(fieldId, panel);
    const count = getCommentsForField(fieldId).length;
    if (btn) {
      btn.textContent = count > 0 ? `💬 ${count}` : '💬';
      btn.classList.toggle('has-comments', count > 0);
    }
  }
}

function toggleComments(fieldId) {
  const panel = document.getElementById(`comments-${fieldId}`);
  if (!panel) return;
  const isOpen = panel.classList.contains('open');
  if (isOpen) {
    panel.classList.remove('open');
  } else {
    panel.classList.add('open');
    renderComments(fieldId, panel);
    showCommentForm(fieldId, panel);
  }
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
